name: Windows 构建与发布

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 校验标签与程序版本
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $package = Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json
          $tauri = Get-Content -LiteralPath 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($env:RELEASE_TAG -cne $expectedTag -or $tauri.version -cne $package.version) {
            throw '标签必须为 v 加 package.json 版本，且须与 Tauri 版本一致。'
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: 安装前端依赖
        run: npm ci
      - name: 核心逻辑测试
        timeout-minutes: 1
        run: npm test
      - name: 构建 Windows 程序与离线安装包
        if: github.event_name == 'workflow_dispatch'
        run: npm run tauri build -- -- --locked
      - name: 构建并发布正式 Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          args: -- --locked
          tagName: ${{ github.ref_name }}
          releaseName: 生物实验 ${{ github.ref_name }}
          releaseBody: |
            生物实验桌面端 ${{ github.ref_name }}

            安装包由 GitHub Actions 自动构建，适用于 Windows 10/11 x64。
            请下载下方 NSIS 安装包，包含离线 WebView2 运行环境。
          releaseDraft: false
          prerelease: false
      - name: 保存 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: biology-lab-windows-x64
          path: |
            src-tauri/target/release/biology-lab.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
