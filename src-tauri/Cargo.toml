[package]
name = "biology-lab"
version = "0.1.2"
description = "高中生物虚拟实验演示"
edition = "2021"

[lib]
name = "biology_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
